; Drop this file into the game's EXE folder, next to the proxy DLL.

[stereo]
; Stereo output format. Pick the one your display or headset expects:
;
;   sbs               Side-by-side. Covers 3D TVs in "Side by Side (Half)"
;                     mode AND AR glasses with 32:9 panels that auto-split
;                     between eyes (Xreal, Viture, Rokid).
;
;                     For true "Full SbS" (each eye at the panel's full
;                     width), set render_width/height below to half the
;                     panel width (e.g. 1920x1080 for a 3840x1080 display).
;                     The overlay upscales to fill the panel.
;                     Some games only support 16:9 resolutions and don't
;                     need an override to maintain aspect ratio in Full-SbS.
;
;   tab               Top-and-bottom. 3D TVs in TaB input mode.
;   row_interlaced    Even rows = left eye, odd rows = right.
;                     Passive-polarized 3D displays.
;   column_interlaced Even columns = left, odd columns = right.
;                     Rare passive setups.
;   checkerboard      DLP 3D-Ready TVs (Mitsubishi / Samsung DLP).
;   leiasr            Leia / Simulated Reality autostereoscopic displays.
;   katanga           Publish the stereo image over the Katanga IPC
;                     protocol for a separate VR viewer (Katanga.exe,
;                     VRScreenCap) to display in your HMD. Start the VR
;                     viewer FIRST. The overlay window also shows an SbS
;                     preview so you can verify capture even before the
;                     VR viewer attaches.
mode = sbs

; Swap the left and right eyes.
swap_eyes = 0


[render]
; Required for the stereo overlay to appear over fullscreen-borderless
; games. Set to 0 only if you suspect this is causing a problem.
defeat_directflip = 1

; Force the game into windowed mode so the overlay can sit on top of it.
; Set to 0 only for games whose startup breaks when forced windowed --
; the game will run but the stereo overlay won't be visible.
force_windowed = 1

; Disable the game's vsync. The overlay still presents at refresh rate,
; so the on-screen output stays smooth -- only the game's frame loop
; free-runs. Useful for higher in-game framerates.
disable_vsync = 0

; Lock the cursor inside the game window while the game is focused.
; Released automatically on alt-tab. Enable for games that don't lock
; the cursor themselves in windowed mode.
confine_cursor = 0

; Hide the OS mouse cursor while it's over the game window. Enable for
; games that don't manage cursor visibility themselves; leave at 0 for
; games whose in-game cursor should remain visible.
hide_cursor = 0

; How frames are handed from the game to the overlay.
;
;   1 (default) -- GPU-shared. Fast, zero extra CPU work per frame, works
;                  for most games.
;   0           -- CPU copy. Slower (one extra GPU->CPU->GPU round-trip
;                  per frame, usually only noticeable above 1080p), but
;                  compatible with games that crash under the GPU-shared
;                  path.
;
; Try 1 first. If the game crashes during startup or rendering, switch to 0.
alternate_capture_mode = 1

; Optional: force the game to render at this resolution. Leave at 0,0 to
; let the game pick.
;
; The overlay always upscales to the panel's native resolution, so
; interlaced / checkerboard / LeiaSR patterns line up correctly no matter
; what the game renders at. This setting is purely a performance lever --
; or, for "Full SbS", a way to render at half the panel width so each eye
; gets the correct resolution and aspect ratio.
;
; WARNING: many games cache their viewport from whatever resolution they
; asked for at startup. Forcing a smaller resolution on those games clips
; the rendered image into the top-left corner. If you see top-left
; clipping, set both back to 0.
render_width  = 0
render_height = 0

; CPU-copy path only: downsample each eye's capture buffer to these
; dimensions. Cuts the GPU->CPU readback cost dramatically -- without
; this, capturing at 4K can stall the game thread by ~16 ms per frame
; and halve the framerate.
;
; The overlay resamples anyway, so as long as the per-eye dimensions are
; at least your panel half-width by panel height, the cap is essentially
; lossless.
;
; Recommended on a 4K panel: 1920x1080 per eye (~4x readback speedup) or
; 1920x2160 per eye for pixel-perfect width. Leave at 0,0 for no cap.
copy_width  = 0
copy_height = 0


[debug]
; Log file path (relative to the game EXE if not absolute). Cleared each
; run.
log_file  = 3dvision4all.log
log_level = 1   ; 0=off, 1=info, 2=verbose

; Diagnostic switches for isolating a crash. All default 1 (fully
; enabled). Leave alone unless you're trying to bisect a crash that only
; happens with the wrapper loaded.
;
;   install_device_hooks            : 0 = skip stereo-capture hooks
;                                     (no stereo output).
;   install_d3d9_vtable_hooks       : 0 = skip the wrapper's D3D9 hooks
;                                     entirely (CreateDevice hook never
;                                     fires).
;   install_d3d9_display_mode_hooks : 0 = keep CreateDevice hook but skip
;                                     display-mode enumeration hooks.
;                                     Use when a game crashes while
;                                     querying display modes.
install_device_hooks            = 1
install_d3d9_vtable_hooks       = 1
install_d3d9_display_mode_hooks = 1
