; Drop this file (renamed to 3dvision4all.ini) into the game's EXE folder.

[stereo]
; Stereo output mode for the overlay window (Device B).
;
;   sbs               side-by-side — each half of the output is one eye.
;                     This covers BOTH the HDMI "Side by Side (Half)" 3DTV
;                     input mode AND AR glasses with 32:9 panels that
;                     auto-split between eyes (Xreal/Viture/Rokid).
;
;                     "Full SbS" (2W × H per eye) To produce that, 
;                     it may be necessary to force the game to render at
;                     half the panel width via the [render] override below
;                     (e.g. 1920x1080 for a 3840x1080 display) - the
;                     upscale then yields a true full-rate-per-eye signal.
;                     If the game only supports 16:9 resolutions you may
;                     not need to override it.
;   tab               top-and-bottom — 3DTV in TaB input mode
;   row_interlaced    even rows = L, odd rows = R — passive-polarized 3D
;   column_interlaced even cols = L, odd cols = R — rare passive setups
;   checkerboard      DLP 3D-Ready TVs (Mitsubishi / Samsung DLP)
;   leiasr            SR weaver to a Leia / Simulated Reality display
;   katanga           Publish a DX11 shared texture over the Katanga IPC
;                     protocol (named MMF "Local\KatangaMappedFile" +
;                     named mutex "KatangaSetupMutex") so a separate VR
;                     viewer process picks up the stereo image and
;                     renders it in your HMD. Compatible with Katanga.exe
;                     and VRScreenCap. Launch the VR viewer FIRST so it
;                     creates the MMF/mutex; we'll attach within ~1 sec
;                     of the game starting. The overlay window also
;                     shows an SbS preview so you can verify capture
;                     even before the VR viewer attaches. The published
;                     texture is full-SbS (2W × H), R-on-LEFT /
;                     L-on-RIGHT — the Katanga ecosystem convention.
;                     This is independent of the swap_eyes knob below;
;                     if you want L-on-LEFT instead, pass
;                     --swap-eyes=false to vr-screen-cap (or the
;                     equivalent on Katanga.exe).
mode = sbs

; Request an EXTRA swap on top of the default capture-side fixup. The
; reverse-stereo-blit capture path returns R on the left half and L on the
; right, and we already swap those back so every output mode reads L on
; left, R on right. Default 0 = leave that default fixup alone. Set to 1
; only in the rare case where a game's stereo capture is ALREADY in natural
; order (then the default fixup would reverse them; this knob cancels it).
swap_eyes = 0


[render]
; Add WS_EX_LAYERED to the game's window so DWM can't DirectFlip its
; swap chain — required for our overlay to composite over fullscreen
; borderless DX9 games. Set 0 only if you suspect this is causing trouble.
defeat_directflip = 1

; Force pp->Windowed = TRUE on every CreateDevice/Reset. Default ON because
; our overlay (a layered topmost window) cannot show over an FSE swap chain
; — FSE bypasses DWM entirely. Set to 0 for games whose 3D init path is
; FSE-only and breaks when yanked into windowed during startup. With this
; off, the game runs but our overlay won't be visible over it.
force_windowed = 1

; Override pp->PresentationInterval to D3DPRESENT_INTERVAL_IMMEDIATE in
; CreateDevice/Reset, disabling the game's vsync. 
; The overlay still goes through DWM at refresh rate so on-screen output
; stays smooth; only the game's render loop free-runs.
disable_vsync = 0

; ClipCursor confines the cursor to the game HWND while the game is the
; foreground process, mirroring the FSE behavior that force_windowed
; disables. Released on alt-tab so other windows work normally. Enable for
; games that don't ClipCursor themselves in windowed mode. Default 0.
confine_cursor = 0

; Hide the OS cursor while it's over the game window. Three layers of
; defense:
;   1. Overlay window uses a fully-transparent class cursor (so the
;      system arrow doesn't show on top of our composite).
;   2. The game's own window class hCursor is swapped to invisible
;      (SetClassLongPtr) so DefWindowProc's WM_SETCURSOR default also
;      hides the cursor.
;   3. The game's WndProc is subclassed to swallow WM_SETCURSOR directly,
;      and the overlay thread calls SetCursor(NULL) per frame.
; Enable for games that don't manage cursor visibility in windowed mode.
; Leave at 0 for games whose in-game cursor should be visible.
hide_cursor = 0

; Capture path from Device A (game's D3D9) to Device B (overlay's D3D11).
;
;   1 (default) — GPU SHARED TEXTURE. We upgrade the game's D3D9 device
;     to D3D9Ex and create the staging texture with a kernel shared
;     handle; Device B opens it via OpenSharedResource. Zero CPU readback
;     per frame. Side effect: Ex rejects D3DPOOL_MANAGED, so the wrapper
;     transparently rewrites MANAGED → DEFAULT + DYNAMIC on all game-side
;     resource creates. This is the historical default and works for most
;     games, but a few games crash inside their own resource pipeline
;     under the Ex device upgrade and / or the MANAGED rewrite — switch
;     to mode 0 for those.
;
;   0 — CPU COPY. Game stays on plain (non-Ex) D3D9, no MANAGED rewrite.
;     Staging is read back via GetRenderTargetData → SYSTEMMEM → CPU
;     buffer, then Map'd into a D3D11 DYNAMIC texture on Device B each
;     frame. Costs one extra GPU→CPU + CPU→GPU round-trip per frame
;     (usually invisible at <= 1080p, measurable at 4K but functional).
alternate_capture_mode = 1

; Optional: force the game to render at this resolution. Set to 0,0 (the
; default) to leave the game's requested resolution alone — windowed mode
; is still forced regardless.
;
; When non-zero, this knob does three things at once:
;   1. Stamps BackBufferWidth/Height in CreateDevice/Reset.
;   2. Lies to D3D's display-mode enumeration (GetAdapterDisplayMode,
;      EnumAdapterModes, GetAdapterModeCount) about what's available.
;   3. Lies to Win32 (GetSystemMetrics SM_CX/CYSCREEN), GDI (GetDeviceCaps
;      HORZRES/VERTRES), and EnumDisplaySettingsW/A about the desktop.
;
; The overlay always upscales the captured staging to the panel's native
; resolution via the compose shader, so interlaced / checkerboard / LeiaSR
; patterns line up pixel-perfectly with the panel regardless of what the
; game renders at. This knob is therefore purely a performance lever — or,
; for "full-SbS" output, a way to deliberately render at half the panel
; width so each eye ends up at full per-axis rate after upscale.
;
; WARNING: many engines cache their viewport / projection from whatever
; resolution they asked for at the FIRST CreateDevice. Forcing a smaller
; BB on those games clips their render to the top-left of the BB ("top-
; left quarter" failure across every stereo mode). Set non-zero only when
; the specific game cooperates; if you see top-left clipping, set this
; back to 0,0 and let the game render at its own choice.
render_width  = 0
render_height = 0

; Per-eye downsample resolution for the cross-API staging texture (CPU-
; readback path only). The staging is normally 2 × BB_width by BB_height
; — at 4K BB that's 7680x2160 ≈ 66 MB. The capture thread's
; GetRenderTargetData drains this each frame while holding the D3D9
; device lock; with a large staging that stalls the game thread's next
; StretchRect for ~16 ms and halves framerate.
;
; When both dims are non-zero, the StretchRect into the staging
; downsamples on the GPU to (2 × copy_width, copy_height) — 
; the readback drains much faster. The compose
; shader already resamples each panel-half from (staging_width/2,
; staging_height) anyway, so as long as the per-eye dims are at least the
; panel-half / panel-height, the cap is essentially lossless.
;
; Recommended starting point on a 4K panel: 1920x1080 per eye (~4×
; readback speedup), or 1920x2160 per eye for pixel-perfect width.
; Default 0,0 = no cap.
copy_width  = 0
copy_height = 0


[debug]
; Path is relative to the game EXE if not absolute. Truncated each run.
log_file  = 3dvision4all.log
log_level = 1   ; 0=off, 1=info, 2=verbose

; Diagnostic knobs — three points where the hook surface can be cut off
; to bisect a crash. All default 1 (full hook coverage). Leave alone
; unless you're actively triaging a crash that's reproducible only with
; the wrapper loaded.
;
;   install_device_hooks            : 0 = skip per-device vtable hooks
;                                     (Present / Reset / Create*). No
;                                     stereo capture occurs.
;   install_d3d9_vtable_hooks       : 0 = skip the IDirect3D9 vtable hooks
;                                     entirely. Hooked_CreateDevice never
;                                     fires.
;   install_d3d9_display_mode_hooks : 0 = install CreateDevice hook but
;                                     skip the three display-mode
;                                     enumerator hooks. Set this when a
;                                     game's display-mode init crashes
;                                     inside the trampoline for those.
install_device_hooks            = 1
install_d3d9_vtable_hooks       = 1
install_d3d9_display_mode_hooks = 1
